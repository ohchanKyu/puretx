spring:
  datasource:
    url: jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

puretx:
  mode: WARN
  max-duration: 300ms
  app-packages:
    - com.example.shop

logging:
  level:
    root: warn
    com.example.shop: info
    io.github.ohchankyu.puretx: info
