name: build

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets: a stack of branches merged in order should each be
  # checked, not only the one at the bottom.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: java ${{ matrix.java }} / spring boot ${{ matrix.spring-boot }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The README promises Java 17+ and Spring Boot 3.2+. Every cell here is a version of that
        # promise being checked: the oldest Boot 3, the newest Boot 3, and each Boot 4 line, on
        # the oldest Java the code targets and the one most people actually run it on.
        java: ['17', '21']
        spring-boot: ['3.2.12', '3.5.16', '4.0.8', '4.1.1']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` runs checkstyle and the tests. maxWarnings = 0 means a style
      # violation fails here too, not just locally.
      - name: Build
        run: ./gradlew build --no-daemon -PspringBootVersion=${{ matrix.spring-boot }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-java-${{ matrix.java }}-boot-${{ matrix.spring-boot }}
          path: |
            **/build/reports/tests/
            **/build/reports/checkstyle/
          retention-days: 7
