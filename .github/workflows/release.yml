name: release

# A tag is a release. Pushing v1.2.3 builds and tests that commit against every supported
# Spring Boot line, builds the signed artifacts under that version, opens a GitHub release whose
# notes are that version's section of the changelog, and publishes to Maven Central.
#
# Secrets: SIGNING_KEY and SIGNING_PASSWORD, an ASCII-armoured PGP private key and its
# passphrase; CENTRAL_USERNAME and CENTRAL_PASSWORD, a Central Portal user token. Central
# publishing is the last step, because a version on Central cannot be re-uploaded: if it fails,
# fix the cause and re-run the failed job rather than pushing a new tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    name: java ${{ matrix.java }} / spring boot ${{ matrix.spring-boot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        java: ['17', '21']
        spring-boot: ['3.2.12', '3.5.16', '4.0.8', '4.1.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --no-daemon -PspringBootVersion=${{ matrix.spring-boot }}

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build artifacts
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenLocal --no-daemon -x test -Pversion=${{ steps.version.outputs.version }}

      - name: Release notes from the changelog
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section for ${{ steps.version.outputs.version }}; add one before tagging." >&2
            exit 1
          fi

      # Skipped when the release already exists, so a re-run after a Central failure does not
      # trip over its own earlier success.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          prerelease=""
          case "${{ steps.version.outputs.version }}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --title "puretx ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            ~/.m2/repository/io/github/ohchankyu/puretx-core/${{ steps.version.outputs.version }}/*.jar \
            ~/.m2/repository/io/github/ohchankyu/puretx-spring-boot-starter/${{ steps.version.outputs.version }}/*.jar

      - name: Publish to Maven Central
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: ./gradlew nmcpPublishAggregationToCentralPortal --no-daemon -x test -Pversion=${{ steps.version.outputs.version }}
