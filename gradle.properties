group=io.github.ohchankyu
version=0.1.0-SNAPSHOT

springBootVersion=3.5.16

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# The oldest Spring Boot puretx supports and compiles against. TransactionExecutionListener
# arrived in Spring Framework 6.1, which is Boot 3.2.
springBootBaselineVersion=3.2.0
# The first Spring Boot 4, which moved the HTTP client customizers to new packages. Only those
# two modules are compiled against, non-transitively, so the rest of the build stays on 3.2.
springBoot4BaselineVersion=4.0.0
slf4jBaselineVersion=2.0.9
